name: Sync Rules

on:
  schedule:
    # 每天北京时间 08:00
    - cron: "0 0 * * *"

  # 允许手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # 1. Checkout 自己的仓库
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ==========================================
      # 2. 下载 milangree/rules
      #
      # 只拉取：
      # rules/mihomo
      # ==========================================
      - name: Clone milangree rules
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/milangree-rules

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/milangree/rules.git \
            /tmp/milangree-rules

          cd /tmp/milangree-rules

          git sparse-checkout set rules/mihomo


      # ==========================================
      # 3. milangree → Mihomo
      #
      # 只复制已经存在的 .mrs
      #
      # 不进行任何转换
      # ==========================================
      - name: Sync milangree MRS to Mihomo
        shell: bash
        run: |
          set -Eeuo pipefail

          SRC="/tmp/milangree-rules/rules/mihomo"
          DST="$GITHUB_WORKSPACE/rules/Mihomo"

          rm -rf "$DST"
          mkdir -p "$DST"


          find "$SRC" \
            -type f \
            -name "*.mrs" \
            -print0 |
          while IFS= read -r -d '' file
          do

              relative="${file#$SRC/}"

              target="$DST/$relative"

              mkdir -p \
                "$(dirname "$target")"

              cp \
                "$file" \
                "$target"

          done


      # ==========================================
      # 4. Mihomo 只保留 MRS
      # ==========================================
      - name: Cleanup Mihomo
        shell: bash
        run: |
          set -Eeuo pipefail

          find rules/Mihomo \
            -type f \
            ! -name "*.mrs" \
            -delete

          find rules/Mihomo \
            -type d \
            -empty \
            -delete


      # ==========================================
      # 5. 下载 MetaCubeX/meta-rules-dat
      #
      # branch:
      # meta
      #
      # path:
      # geo/geoip
      # ==========================================
      - name: Clone MetaCubeX geoip
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/meta-rules-dat

          git clone \
            --depth 1 \
            --branch meta \
            --filter=blob:none \
            --sparse \
            https://github.com/MetaCubeX/meta-rules-dat.git \
            /tmp/meta-rules-dat

          cd /tmp/meta-rules-dat

          git sparse-checkout set geo/geoip


      # ==========================================
      # 6. MetaCubeX → geoip
      #
      # 只复制现成的 .mrs
      # ==========================================
      - name: Sync MetaCubeX MRS to geoip
        shell: bash
        run: |
          set -Eeuo pipefail

          SRC="/tmp/meta-rules-dat/geo/geoip"
          DST="$GITHUB_WORKSPACE/rules/geoip"

          rm -rf "$DST"
          mkdir -p "$DST"


          find "$SRC" \
            -type f \
            -name "*.mrs" \
            -print0 |
          while IFS= read -r -d '' file
          do

              cp \
                "$file" \
                "$DST/"

          done


      # ==========================================
      # 7. geoip 只保留 MRS
      # ==========================================
      - name: Cleanup geoip
        shell: bash
        run: |
          set -Eeuo pipefail

          find rules/geoip \
            -type f \
            ! -name "*.mrs" \
            -delete

          find rules/geoip \
            -type d \
            -empty \
            -delete


      # ==========================================
      # 8. X-Shelby → cnip
      #
      # 直接拉取现成 MRS
      # ==========================================
      - name: Sync X-Shelby CN IP
        shell: bash
        run: |
          set -Eeuo pipefail

          DST="$GITHUB_WORKSPACE/rules/cnip"

          rm -rf "$DST"
          mkdir -p "$DST"


          for file in \
            cn.mrs \
            cn_v4.mrs \
            cn_v6.mrs \
            cnip_all.mrs
          do

              echo "Downloading $file"

              curl -fL \
                "https://github.com/X-Shelby/geoip/releases/download/latest/${file}" \
                -o "$DST/$file"

          done


      # ==========================================
      # 9. cnip 只保留 MRS
      # ==========================================
      - name: Cleanup cnip
        shell: bash
        run: |
          set -Eeuo pipefail

          find rules/cnip \
            -type f \
            ! -name "*.mrs" \
            -delete

          find rules/cnip \
            -type d \
            -empty \
            -delete


      # ==========================================
      # 10. 下载 217heidai/adblockfilters
      # ==========================================
      - name: Clone 217heidai adblockfilters
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/adblockfilters

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/217heidai/adblockfilters.git \
            /tmp/adblockfilters


      # ==========================================
      # 11. 217heidai → AdBlock
      #
      # 只复制现成的 .mrs
      # ==========================================
      - name: Sync 217heidai MRS to AdBlock
        shell: bash
        run: |
          set -Eeuo pipefail

          SRC="/tmp/adblockfilters/rules"
          DST="$GITHUB_WORKSPACE/rules/AdBlock"

          rm -rf "$DST"
          mkdir -p "$DST"


          find "$SRC" \
            -type f \
            -name "*.mrs" \
            -print0 |
          while IFS= read -r -d '' file
          do

              relative="${file#$SRC/}"

              target="$DST/$relative"

              mkdir -p \
                "$(dirname "$target")"

              cp \
                "$file" \
                "$target"

          done


      # ==========================================
      # 12. AdBlock 只保留 MRS
      # ==========================================
      - name: Cleanup AdBlock
        shell: bash
        run: |
          set -Eeuo pipefail

          find rules/AdBlock \
            -type f \
            ! -name "*.mrs" \
            -delete

          find rules/AdBlock \
            -type d \
            -empty \
            -delete


      # ==========================================
      # 13. 最终检查
      #
      # rules/ 下只允许 .mrs
      # ==========================================
      - name: Check final rules
        shell: bash
        run: |
          set -Eeuo pipefail


          echo ""
          echo "=========================================="
          echo "Final rules structure"
          echo "=========================================="


          find rules \
            -type f \
            | sort


          echo ""
          echo "=========================================="
          echo "Statistics"
          echo "=========================================="


          echo "Mihomo:"
          find rules/Mihomo \
            -type f \
            -name "*.mrs" \
            | wc -l


          echo "geoip:"
          find rules/geoip \
            -type f \
            -name "*.mrs" \
            | wc -l


          echo "cnip:"
          find rules/cnip \
            -type f \
            -name "*.mrs" \
            | wc -l


          echo "AdBlock:"
          find rules/AdBlock \
            -type f \
            -name "*.mrs" \
            | wc -l


          echo ""
          echo "=========================================="
          echo "Checking non-MRS files"
          echo "=========================================="


          NON_MRS=$(find rules \
            -type f \
            ! -name "*.mrs" \
            | wc -l)


          echo "Non-MRS files: $NON_MRS"


          if [ "$NON_MRS" -ne 0 ]; then

              echo ""
              echo "ERROR: Non-MRS files detected!"

              find rules \
                -type f \
                ! -name "*.mrs"

              exit 1

          fi


          echo ""
          echo "=========================================="
          echo "SUCCESS"
          echo "=========================================="


          echo "All files under rules/ are MRS."


      # ==========================================
      # 14. 提交更新
      # ==========================================
      - name: Commit changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add rules


          if git diff --cached --quiet; then

              echo "No changes detected."

          else

              git commit \
                -m "sync: update rules"

              git push

          fi
