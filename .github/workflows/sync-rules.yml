name: Sync Rules

on:
  schedule:
    # 每天北京时间 08:00
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # 1. Checkout 自己的仓库
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ==========================================
      # 2. 下载 BlackMatrix7
      # ==========================================
      - name: Clone BlackMatrix7
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/ios_rule_script

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/blackmatrix7/ios_rule_script.git \
            /tmp/ios_rule_script

          cd /tmp/ios_rule_script

          git sparse-checkout set rule/Clash


      # ==========================================
      # 3. 下载 217heidai
      # ==========================================
      - name: Clone 217heidai
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/adblockfilters

          git clone \
            --depth 1 \
            https://github.com/217heidai/adblockfilters.git \
            /tmp/adblockfilters


      # ==========================================
      # 4. 下载 X-Shelby GeoIP
      # ==========================================
      - name: Download X-Shelby geoip
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/geoip

          mkdir -p /tmp/geoip

          for file in \
            cn.mrs \
            cn_v4.mrs \
            cn_v6.mrs \
            cnip_all.mrs
          do

            curl -fL \
              "https://github.com/X-Shelby/geoip/releases/download/latest/${file}" \
              -o "/tmp/geoip/${file}"

          done


      # ==========================================
      # 5. 下载 Mihomo
      # ==========================================
      - name: Download Mihomo
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/mihomo

          mkdir -p /tmp/mihomo

          curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            -o /tmp/mihomo/release.json

          python3 <<'PY'
          import json
          import sys

          with open("/tmp/mihomo/release.json") as f:
              data = json.load(f)

          assets = data.get("assets", [])

          # 优先选择 Linux amd64 compatible
          patterns = [
              "linux-amd64-compatible",
              "linux-amd64"
          ]

          found = None

          for pattern in patterns:
              for asset in assets:
                  name = asset["name"]

                  if (
                      pattern in name
                      and name.endswith(".gz")
                  ):
                      found = asset["browser_download_url"]
                      break

              if found:
                  break

          if not found:
              print("Available assets:")

              for asset in assets:
                  print(asset["name"])

              sys.exit(
                  "ERROR: Cannot find Mihomo Linux amd64 release"
              )

          print(found)

          with open(
              "/tmp/mihomo/download_url",
              "w"
          ) as f:
              f.write(found)
          PY

          URL=$(cat /tmp/mihomo/download_url)

          echo "Downloading:"
          echo "$URL"

          curl -fL \
            "$URL" \
            -o /tmp/mihomo/mihomo.gz

          gunzip \
            /tmp/mihomo/mihomo.gz

          chmod +x \
            /tmp/mihomo/mihomo

          /tmp/mihomo/mihomo -v


      # ==========================================
# 6. BlackMatrix7 → Mihomo
      #
      # 最终只保留 MRS
      # ==========================================
      - name: Sync BlackMatrix7 to Mihomo
        shell: bash
        run: |
          set -Eeuo pipefail

          SRC="/tmp/ios_rule_script/rule/Clash"
          DST="$GITHUB_WORKSPACE/rules/Mihomo"
          MIHOMO="/tmp/mihomo/mihomo"

          # 完全删除旧版本
          rm -rf "$DST"

          mkdir -p "$DST"

          python3 <<'PY'
          import os
          import subprocess

          SRC = "/tmp/ios_rule_script/rule/Clash"
          DST = os.environ["GITHUB_WORKSPACE"] + "/rules/Mihomo"
          MIHOMO = "/tmp/mihomo/mihomo"

          converted = 0
          skipped = 0
          failed = 0


          def get_behavior(filename):

              name = filename.lower()

              # ------------------------------
              # classical
              # MRS 不支持
              # ------------------------------
              if "_classical" in name:
                  return None

              # ------------------------------
              # ipcidr
              # ------------------------------
              if "_ipcidr" in name:
                  return "ipcidr"

              # ------------------------------
              # domain
              # ------------------------------
              if "_domain" in name:
                  return "domain"

              # ------------------------------
              # 其他文件
              # ------------------------------
              return None


          for root, dirs, files in os.walk(SRC):

              for filename in files:

                  # 只处理 yaml
                  if not filename.lower().endswith(".yaml"):
                      continue

                  behavior = get_behavior(filename)

                  # 无法转换的直接跳过
                  if behavior is None:

                      print(
                          f"SKIP: {os.path.join(root, filename)}"
                      )

                      skipped += 1
                      continue


                  source = os.path.join(
                      root,
                      filename
                  )


                  # --------------------------------
                  # 保留原目录结构
                  # --------------------------------
                  relative_dir = os.path.relpath(
                      root,
                      SRC
                  )

                  if relative_dir == ".":
                      relative_dir = ""


                  target_dir = os.path.join(
                      DST,
                      relative_dir
                  )

                  os.makedirs(
                      target_dir,
                      exist_ok=True
                  )


                  name = os.path.splitext(
                      filename
                  )[0]


                  output = os.path.join(
                      target_dir,
                      name + ".mrs"
                  )


                  print()
                  print("=" * 70)
                  print("Source :", source)
                  print("Behavior:", behavior)
                  print("Output :", output)
                  print("=" * 70)


                  result = subprocess.run(
                      [
                          MIHOMO,
                          "convert-ruleset",
                          behavior,
                          "yaml",
                          source,
                          output
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True
                  )


                  print(result.stdout)


                  # --------------------------------
                  # 成功
                  # --------------------------------
                  if (
                      result.returncode == 0
                      and os.path.isfile(output)
                      and os.path.getsize(output) > 0
                  ):

                      converted += 1

                      print(
                          "SUCCESS:",
                          output
                      )


                  # --------------------------------
                  # 失败
                  # --------------------------------
                  else:

                      failed += 1

                      print(
                          "FAILED:",
                          source
                      )

                      # 防止留下错误 MRS
                      if os.path.exists(output):
                          os.remove(output)


          print()
          print("=" * 70)
          print("BlackMatrix7 conversion completed")
          print("=" * 70)
          print("Converted:", converted)
          print("Skipped  :", skipped)
          print("Failed   :", failed)
          print("=" * 70)

          PY


      # ==========================================
      # 7. Mihomo 强制只保留 MRS
      # ==========================================
      - name: Cleanup Mihomo
        shell: bash
        run: |
          set -Eeuo pipefail

          find rules/Mihomo \
            -type f \
            ! -name "*.mrs" \
            -delete

          find rules/Mihomo \
            -type d \
            -empty \
            -delete


      # ==========================================
# 8. 217heidai → AdBlock
      # ==========================================
      - name: Sync 217heidai to AdBlock
        shell: bash
        run: |
          set -Eeuo pipefail

          SRC="/tmp/adblockfilters/rules"
          DST="$GITHUB_WORKSPACE/rules/AdBlock"

          rm -rf "$DST"

          mkdir -p "$DST"

          # 只复制 MRS
          find "$SRC" \
            -type f \
            -name "*.mrs" \
            -print0 |
          while IFS= read -r -d '' file
          do

            relative="${file#$SRC/}"

            target="$DST/$relative"

            mkdir -p \
              "$(dirname "$target")"

            cp "$file" "$target"

          done


      # ==========================================
      # 9. AdBlock 强制只保留 MRS
      # ==========================================
      - name: Cleanup AdBlock
        shell: bash
        run: |
          set -Eeuo pipefail

          find rules/AdBlock \
            -type f \
            ! -name "*.mrs" \
            -delete

          find rules/AdBlock \
            -type d \
            -empty \
            -delete


      # ==========================================
      # 10. X-Shelby → geoip
      # ==========================================
      - name: Sync X-Shelby to geoip
        shell: bash
        run: |
          set -Eeuo pipefail

          DST="$GITHUB_WORKSPACE/rules/geoip"

          rm -rf "$DST"

          mkdir -p "$DST"

          cp -a \
            /tmp/geoip/. \
            "$DST/"


      # ==========================================
      # 11. geoip 强制只保留 MRS
      # ==========================================
      - name: Cleanup geoip
        shell: bash
        run: |
          set -Eeuo pipefail

          find rules/geoip \
            -type f \
            ! -name "*.mrs" \
            -delete

          find rules/geoip \
            -type d \
            -empty \
            -delete


      # ==========================================
      # 12. 最终检查
      # ==========================================
      - name: Check final rules
        shell: bash
        run: |
          set -Eeuo pipefail

          echo ""
          echo "=========================================="
          echo "Final directory"
          echo "=========================================="

          find rules \
            -type f \
            | sort


          echo ""
          echo "=========================================="
          echo "MRS count"
          echo "=========================================="

          find rules \
            -type f \
            -name "*.mrs" \
            | wc -l


          echo ""
          echo "=========================================="
          echo "Non-MRS files"
          echo "=========================================="

          NON_MRS=$(find rules \
            -type f \
            ! -name "*.mrs" \
            | wc -l)

          echo "Non-MRS count: $NON_MRS"


          if [ "$NON_MRS" -ne 0 ]; then

            echo ""
            echo "ERROR: Non-MRS files detected"

            find rules \
              -type f \
              ! -name "*.mrs"

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "SUCCESS"
          echo "All files are MRS."
          echo "=========================================="


      # ==========================================
      # 13. 提交
      # ==========================================
      - name: Commit changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules

          if git diff --cached --quiet; then

            echo "No changes detected."

          else

            git commit \
              -m "sync: update rules"

            git push

          fi
