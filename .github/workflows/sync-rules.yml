name: Sync Rules

on:
  schedule:
    # 每天北京时间 08:00
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ==========================================
      # 2. 清理旧规则
      # ==========================================
      - name: Clean old rules
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf rules

          mkdir -p \
            rules/Mihomo \
            rules/geoip \
            rules/cnip \
            rules/AdBlock


      # ==========================================
      # 3. Clone milangree
      #
      # rules/mihomo
      # ==========================================
      - name: Clone milangree rules
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/milangree-rules

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/milangree/rules.git \
            /tmp/milangree-rules

          cd /tmp/milangree-rules

          git sparse-checkout set rules/mihomo


      # ==========================================
      # 4. milangree → Mihomo
      #
      # 只复制 .mrs
      # 保留所有子目录结构
      # ==========================================
      - name: Sync milangree MRS
        shell: bash
        run: |
          set -Eeuo pipefail

          SRC="/tmp/milangree-rules/rules/mihomo"
          DST="$GITHUB_WORKSPACE/rules/Mihomo"

          if [ ! -d "$SRC" ]; then
            echo "ERROR: milangree Mihomo directory not found"
            exit 1
          fi

          COUNT=0

          while IFS= read -r -d '' file
          do

            relative="${file#$SRC/}"

            target="$DST/$relative"

            mkdir -p "$(dirname "$target")"

            cp "$file" "$target"

            echo "Copy: $relative"

            COUNT=$((COUNT + 1))

          done < <(
            find "$SRC" \
              -type f \
              -name "*.mrs" \
              -print0
          )

          echo ""
          echo "milangree MRS count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No MRS files found"
            exit 1
          fi


      # ==========================================
      # 5. Clone MetaCubeX
      #
      # geo/geoip
      # ==========================================
      - name: Clone MetaCubeX geoip
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/meta-rules-dat

          git clone \
            --depth 1 \
            --branch meta \
            --filter=blob:none \
            --sparse \
            https://github.com/MetaCubeX/meta-rules-dat.git \
            /tmp/meta-rules-dat

          cd /tmp/meta-rules-dat

          git sparse-checkout set geo/geoip


      # ==========================================
      # 6. MetaCubeX → geoip
      #
      # 只复制 .mrs
      # 保留子目录结构
      # ==========================================
      - name: Sync MetaCubeX GeoIP MRS
        shell: bash
        run: |
          set -Eeuo pipefail

          SRC="/tmp/meta-rules-dat/geo/geoip"
          DST="$GITHUB_WORKSPACE/rules/geoip"

          if [ ! -d "$SRC" ]; then
            echo "ERROR: MetaCubeX geoip directory not found"
            exit 1
          fi

          COUNT=0

          while IFS= read -r -d '' file
          do

            relative="${file#$SRC/}"

            target="$DST/$relative"

            mkdir -p "$(dirname "$target")"

            cp "$file" "$target"

            echo "Copy: $relative"

            COUNT=$((COUNT + 1))

          done < <(
            find "$SRC" \
              -type f \
              -name "*.mrs" \
              -print0
          )

          echo ""
          echo "MetaCubeX GeoIP MRS count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No GeoIP MRS files found"
            exit 1
          fi


      # ==========================================
      # 7. X-Shelby → cnip
      #
      # 直接下载 4 个 MRS
      # ==========================================
      - name: Sync X-Shelby CN IP
        shell: bash
        run: |
          set -Eeuo pipefail

          DST="$GITHUB_WORKSPACE/rules/cnip"

          for file in \
            cn.mrs \
            cn_v4.mrs \
            cn_v6.mrs \
            cnip_all.mrs
          do

            echo "Downloading: $file"

            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-delay 2 \
              --silent \
              --show-error \
              "https://github.com/X-Shelby/geoip/releases/download/latest/${file}" \
              -o "$DST/$file"

            if [ ! -s "$DST/$file" ]; then
              echo "ERROR: $file is empty"
              exit 1
            fi

          done


      # ==========================================
      # 8. Clone 217heidai
      #
      # rules
      # ==========================================
      - name: Clone 217heidai adblockfilters
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/adblockfilters

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/217heidai/adblockfilters.git \
            /tmp/adblockfilters

          cd /tmp/adblockfilters

          git sparse-checkout set rules


      # ==========================================
      # 9. 217heidai → AdBlock
      #
      # 只复制 .mrs
      # 保留子目录结构
      # ==========================================
      - name: Sync 217heidai MRS
        shell: bash
        run: |
          set -Eeuo pipefail

          SRC="/tmp/adblockfilters/rules"
          DST="$GITHUB_WORKSPACE/rules/AdBlock"

          if [ ! -d "$SRC" ]; then
            echo "ERROR: 217heidai rules directory not found"
            exit 1
          fi

          COUNT=0

          while IFS= read -r -d '' file
          do

            relative="${file#$SRC/}"

            target="$DST/$relative"

            mkdir -p "$(dirname "$target")"

            cp "$file" "$target"

            echo "Copy: $relative"

            COUNT=$((COUNT + 1))

          done < <(
            find "$SRC" \
              -type f \
              -name "*.mrs" \
              -print0
          )

          echo ""
          echo "217heidai MRS count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No AdBlock MRS files found"
            exit 1
          fi


      # ==========================================
      # 10. 最终清理
      #
      # rules 下只允许 .mrs
      # ==========================================
      - name: Cleanup non-MRS files
        shell: bash
        run: |
          set -Eeuo pipefail

          find rules \
            -type f \
            ! -name "*.mrs" \
            -delete

          find rules \
            -type d \
            -empty \
            -delete


      # ==========================================
      # 11. 最终检查
      #
      # 允许子目录
      # 但文件只能是 .mrs
      # ==========================================
      - name: Check final rules
        shell: bash
        run: |
          set -Eeuo pipefail

          echo ""
          echo "=========================================="
          echo "Final rules structure"
          echo "=========================================="

          find rules \
            -type f \
            | sort


          echo ""
          echo "=========================================="
          echo "Statistics"
          echo "=========================================="

          echo "Mihomo:"
          find rules/Mihomo \
            -type f \
            -name "*.mrs" \
            | wc -l

          echo "geoip:"
          find rules/geoip \
            -type f \
            -name "*.mrs" \
            | wc -l

          echo "cnip:"
          find rules/cnip \
            -type f \
            -name "*.mrs" \
            | wc -l

          echo "AdBlock:"
          find rules/AdBlock \
            -type f \
            -name "*.mrs" \
            | wc -l


          echo ""
          echo "=========================================="
          echo "Checking non-MRS files"
          echo "=========================================="

          NON_MRS=$(find rules \
            -type f \
            ! -name "*.mrs" \
            | wc -l)

          echo "Non-MRS files: $NON_MRS"

          if [ "$NON_MRS" -ne 0 ]; then

            echo ""
            echo "ERROR: Non-MRS files detected!"

            find rules \
              -type f \
              ! -name "*.mrs"

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "SUCCESS"
          echo "=========================================="

          echo "All files under rules/ are MRS."
          echo "Subdirectories are preserved."


      # ==========================================
      # 12. 提交更新
      # ==========================================
      - name: Commit changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules

          if git diff --cached --quiet; then

            echo "No changes detected."

          else

            git commit \
              -m "sync: update rules"

            git push

          fi
