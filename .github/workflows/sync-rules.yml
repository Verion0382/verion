name: Sync Rules

on:
  schedule:
    # 每天北京时间 08:00 自动运行
    - cron: "0 0 * * *"

  # 允许手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 下载自己的仓库
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 下载 milangree/rules
      - name: Clone milangree rules
        run: |
          git clone --depth 1 \
            https://github.com/milangree/rules.git \
            /tmp/milangree-rules

      # 下载 217heidai/adblockfilters
      - name: Clone 217heidai adblockfilters
        run: |
          git clone --depth 1 \
            https://github.com/217heidai/adblockfilters.git \
            /tmp/adblockfilters

      # 同步 milangree
      - name: Sync milangree rules
        run: |
          rm -rf rules
          mkdir -p rules

          cp -a /tmp/milangree-rules/rules/. ./rules/

      # 同步 217heidai
      - name: Sync 217heidai rules
        run: |
          rm -rf rules/217heidai
          mkdir -p rules/217heidai

          cp -a /tmp/adblockfilters/rules/. ./rules/217heidai/

      # 提交更新
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "sync: update rules"
            git push
          fi
