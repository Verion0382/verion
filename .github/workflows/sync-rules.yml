name: Sync Rules

on:

  # 每天北京时间 08:00
  #
  # GitHub Actions 使用 UTC
  # UTC 00:00 = 北京时间 08:00

  schedule:
    - cron: "0 4 * * *"

  # 手动运行

  workflow_dispatch:


permissions:
  contents: write


jobs:

  sync:

    name: Sync Rules

    runs-on: ubuntu-latest


    steps:

      # ========================================================
      # 1. Checkout
      # ========================================================

      - name: Checkout repository

        uses: actions/checkout@v5

        with:
          fetch-depth: 1


      # ========================================================
      # 2. Python
      # ========================================================

      - name: Setup Python

        uses: actions/setup-python@v6

        with:
          python-version: "3.x"


      # ========================================================
      # 3. 安装 requests
      # ========================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests


      # ========================================================
      # 4. 同步规则
      # ========================================================

      - name: Sync Rules

        run: |

          python sync_rules.py


      # ========================================================
      # 5. 显示最终文件
      # ========================================================

      - name: Show Rules

        run: |

          echo ""
          echo "=========================================="
          echo "FINAL RULE FILES"
          echo "=========================================="

          find rules -type f | sort


      # ========================================================
      # 6. 统计
      # ========================================================

      - name: Rule Statistics

        run: |

          echo ""
          echo "=========================================="
          echo "RULE STATISTICS"
          echo "=========================================="

          echo ""
          echo "Mihomo:"
          find rules/Mihomo \
            -type f \
            -name "*.mrs" \
            2>/dev/null \
            | wc -l


          echo ""
          echo "SingBox:"
          find rules/SingBox \
            -type f \
            -name "*.srs" \
            2>/dev/null \
            | wc -l


          echo ""
          echo "DustinWin:"
          find rules/DustinWin \
            -type f \
            -name "*.mrs" \
            2>/dev/null \
            | wc -l


          echo ""
          echo "GeoIP:"
          find rules/geoip \
            -type f \
            -name "*.mrs" \
            2>/dev/null \
            | wc -l


          echo ""
          echo "CNIP:"
          find rules/cnip \
            -type f \
            -name "*.mrs" \
            2>/dev/null \
            | wc -l


          echo ""
          echo "AdBlock:"
          find rules/AdBlock \
            -type f \
            -name "*.mrs" \
            2>/dev/null \
            | wc -l


      # ========================================================
      # 7. Git 状态
      # ========================================================

      - name: Git Status

        run: |

          echo ""
          echo "=========================================="
          echo "GIT STATUS"
          echo "=========================================="

          git status --short


      # ========================================================
      # 8. Commit
      # ========================================================

      - name: Commit changes

        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add rules/


          if git diff --cached --quiet; then

            echo ""
            echo "No rule changes."
            echo "Nothing to commit."

            exit 0

          fi


          git commit \
            -m "chore: sync rules $(date -u '+%Y-%m-%d %H:%M UTC')"


      # ========================================================
      # 9. Push
      # ========================================================

      - name: Push changes

        run: |

          git push
