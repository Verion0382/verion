name: Sync Rules

on:
  schedule:
    # 每天北京时间 08:00 自动运行
    # GitHub Actions 使用 UTC，所以这里是 00:00 UTC
    - cron: "0 0 * * *"

  # 允许手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # ==========================================
      # 同步规则
      # ==========================================
      - name: Sync rules
        run: |
          python sync_rules.py

      # ==========================================
      # 显示最终目录
      # ==========================================
      - name: Show rules
        run: |
          echo "=========================================="
          echo "Final rules:"
          echo "=========================================="

          find rules -type f | sort

          echo "=========================================="
          echo "Rule count:"
          echo "=========================================="

          echo "Mihomo:"
          find rules/Mihomo -type f | wc -l

          echo "SingBox:"
          find rules/SingBox -type f | wc -l

          echo "DustinWin:"
          find rules/DustinWin -type f | wc -l

          echo "geoip:"
          find rules/geoip -type f | wc -l

          echo "cnip:"
          find rules/cnip -type f | wc -l

          echo "AdBlock:"
          find rules/AdBlock -type f | wc -l

      # ==========================================
      # 提交
      # ==========================================
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: sync rules"
            git push
          fi
