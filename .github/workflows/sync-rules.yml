name: Sync Rules

on:

  # 北京时间每天 12:00
  # GitHub Actions 使用 UTC
  # 12:00 CST = 04:00 UTC

  schedule:

    - cron: "0 4 * * *"

  workflow_dispatch:


permissions:

  contents: write


jobs:

  sync:

    name: Sync Rules

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v5

        with:

          fetch-depth: 1


      - name: Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.x"


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests


      - name: Sync Rules

        run: |

          python sync_rules.py


      - name: Show Rules

        run: |

          echo "=========================================="

          echo "FINAL RULE FILES"

          echo "=========================================="


          find rules -maxdepth 2 -type f | sort


      - name: Check Subdirectories

        run: |

          echo "=========================================="

          echo "CHECK SUBDIRECTORIES"

          echo "=========================================="


          if find rules -mindepth 2 -type d | grep -q .; then

            echo "ERROR: Subdirectories detected."

            find rules -mindepth 2 -type d

            exit 1

          fi


          echo "OK: No subdirectories."


      - name: Git Status

        run: |

          git status --short


      - name: Commit Changes

        run: |

          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add rules/


          if git diff --cached --quiet; then

            echo "No changes."

            exit 0

          fi


          git commit \
            -m "chore: sync rules $(date -u '+%Y-%m-%d %H:%M UTC')"


      - name: Push

        run: |

          git push
          
