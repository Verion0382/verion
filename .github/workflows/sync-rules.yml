name: Sync milangree Rules

on:
  schedule:
    # 每天北京时间 04:00
    - cron: "0 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync and Build Rules
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. 获取自己的仓库
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. 获取上游最新提交
      # ==========================================
      - name: Get upstream commit
        id: upstream
        run: |
          set -Eeuo pipefail

          UPSTREAM_COMMIT=$(git ls-remote \
            https://github.com/milangree/rules.git \
            refs/heads/main | cut -f1)

          echo "commit=${UPSTREAM_COMMIT}" >> "$GITHUB_OUTPUT"

          echo "上游 commit:"
          echo "${UPSTREAM_COMMIT}"

      # ==========================================
      # 3. 检查是否已经同步
      # ==========================================
      - name: Check upstream version
        id: check
        run: |
          set -Eeuo pipefail

          CURRENT=$(git log -1 \
            --format='%B' \
            --grep='Upstream-Commit:' \
            | head -n1 \
            | sed 's/.*Upstream-Commit: //')

          UPSTREAM="${{ steps.upstream.outputs.commit }}"

          echo "当前记录: ${CURRENT:-无}"
          echo "上游版本: ${UPSTREAM}"

          if [ "$CURRENT" = "$UPSTREAM" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游没有变化，跳过构建。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到上游更新。"
          fi

      # ==========================================
      # 4. 如果没有更新，直接结束
      # ==========================================
      - name: Stop if no changes
        if: steps.check.outputs.changed == 'false'
        run: |
          echo "没有新的上游规则。"

      # ==========================================
      # 5. 安装 Python
      # ==========================================
      - name: Setup Python
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 6. 下载上游源码
      # ==========================================
      - name: Clone upstream
        if: steps.check.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          git clone \
            --depth 1 \
            https://github.com/milangree/rules.git \
            /tmp/milangree-rules

      # ==========================================
      # 7. 安装 Python 依赖
      # ==========================================
      - name: Install Python dependencies
        if: steps.check.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          cd /tmp/milangree-rules

          python -m venv venv

          source venv/bin/activate

          pip install --upgrade pip

          pip install -r requirements.txt

      # ==========================================
      # 8. 生成规则
      # ==========================================
      - name: Generate rules
        if: steps.check.outputs.changed == 'true'
        env:
          MAXMIND_KEY: ${{ secrets.MAXMIND_KEY }}
        run: |
          set -Eeuo pipefail

          cd /tmp/milangree-rules

          source venv/bin/activate

          python main.py

      # ==========================================
      # 9. 安装 sing-box
      # ==========================================
      - name: Install sing-box
        if: steps.check.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          VERSION="1.10.0-beta.5"

          URL="https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box_${VERSION}_linux_amd64.deb"

          wget -q "$URL" -O sing-box.deb

          sudo dpkg -i sing-box.deb

          rm -f sing-box.deb

          sing-box version

      # ==========================================
      # 10. 安装最新版 Mihomo
      # ==========================================
      - name: Install Mihomo
        if: steps.check.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          VERSION=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep '"tag_name"' \
            | sed 's/.*"tag_name": "\(.*\)".*/\1/')

          echo "Mihomo: ${VERSION}"

          wget -q -O mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz"

          gunzip -c mihomo.gz > mihomo

          chmod +x mihomo

          sudo mv mihomo /usr/local/bin/mihomo

          rm -f mihomo.gz

          mihomo -v

      # ==========================================
      # 11. 编译 Mihomo + Sing-box
      # ==========================================
      - name: Compile rules
        if: steps.check.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          cd /tmp/milangree-rules

          bash compile.sh

      # ==========================================
      # 12. 生成 README
      # ==========================================
      - name: Generate README
        if: steps.check.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          cd /tmp/milangree-rules

          source venv/bin/activate

          python generate_readme.py

      # ==========================================
      # 13. 清理旧规则
      # ==========================================
      - name: Replace generated rules
        if: steps.check.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          rm -rf rules

          mkdir -p rules

          cp -r /tmp/milangree-rules/rules/* rules/

      # ==========================================
      # 14. 检查生成结果
      # ==========================================
      - name: Validate generated rules
        if: steps.check.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          echo "检查 Mihomo..."

          MH_DOMAIN=$(find rules/mihomo \
            -type f \
            -name '*_domain.yaml' \
            | wc -l)

          MH_IPCIDR=$(find rules/mihomo \
            -type f \
            -name '*_ipcidr.yaml' \
            | wc -l)

          MH_MRS=$(find rules/mihomo \
            -type f \
            -name '*.mrs' \
            | wc -l)

          echo "Mihomo domain: ${MH_DOMAIN}"
          echo "Mihomo IP:     ${MH_IPCIDR}"
          echo "Mihomo MRS:    ${MH_MRS}"

          echo "检查 Sing-box..."

          SB_JSON=$(find rules/singbox \
            -type f \
            -name '*.json' \
            | wc -l)

          SB_SRS=$(find rules/singbox \
            -type f \
            -name '*.srs' \
            | wc -l)

          echo "Sing-box JSON: ${SB_JSON}"
          echo "Sing-box SRS:  ${SB_SRS}"

          if [ "$MH_DOMAIN" -eq 0 ] && [ "$MH_IPCIDR" -eq 0 ]; then
            echo "错误：没有生成 Mihomo 规则。"
            exit 1
          fi

          if [ "$SB_JSON" -eq 0 ]; then
            echo "错误：没有生成 Sing-box 规则。"
            exit 1
          fi

          echo "规则检查通过。"

      # ==========================================
      # 15. 提交更新
      # ==========================================
      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules

          git commit \
            -m "sync: update milangree rules" \
            -m "Upstream-Commit: ${{ steps.upstream.outputs.commit }}"

          git push
