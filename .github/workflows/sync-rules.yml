name: Sync milangree Rules

on:
  schedule:
    # 每天北京时间 08:00 自动运行
    - cron: "0 0 * * *"

  # 允许手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 下载你的仓库
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 下载上游仓库
      - name: Clone upstream rules
        run: |
          git clone --depth 1 https://github.com/milangree/rules.git /tmp/milangree-rules

      # 同步 rules 目录
      - name: Sync rules
        run: |
          rm -rf rules
          cp -r /tmp/milangree-rules/rules ./rules

      # 提交更新
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "sync: update rules from milangree/rules"
            git push
          fi
