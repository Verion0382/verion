name: Sync Rules

on:

  # ==========================================================
  # 北京时间每天 12:00
  #
  # GitHub Actions 使用 UTC
  #
  # UTC+8
  # 12:00 CST = 04:00 UTC
  # ==========================================================

  schedule:

    - cron: "0 4 * * *"

  # 手动运行

  workflow_dispatch:


# ============================================================
# 权限
# ============================================================

permissions:

  contents: write


# ============================================================
# JOB
# ============================================================

jobs:

  sync:

    name: Sync Rules

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout

        uses: actions/checkout@v5

        with:

          fetch-depth: 1


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"


      # ======================================================
      # 安装依赖
      #
      # 不使用 pip cache
      # 因此不需要 requirements.txt
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install \
            --disable-pip-version-check \
            --no-warn-script-location \
            --upgrade pip

          pip install \
            --disable-pip-version-check \
            requests


      # ======================================================
      # 同步规则
      # ======================================================

      - name: Sync Rules

        run: |

          python sync_rules.py


      # ======================================================
      # 显示规则
      # ======================================================

      - name: Show Rules

        run: |

          echo "=========================================="

          echo "FINAL RULE FILES"

          echo "=========================================="

          find rules \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort


      # ======================================================
      # 检查子目录
      # ======================================================

      - name: Check Subdirectories

        run: |

          echo "=========================================="

          echo "CHECK SUBDIRECTORIES"

          echo "=========================================="

          if find rules \
            -mindepth 2 \
            -type d \
            | grep -q .; then

            echo "ERROR: Subdirectories detected."

            find rules \
              -mindepth 2 \
              -type d

            exit 1

          fi

          echo "OK: No subdirectories."


      # ======================================================
      # 检查文件数量
      # ======================================================

      - name: Check Rule Files

        run: |

          echo "=========================================="

          echo "CHECK RULE FILES"

          echo "=========================================="


          MRS_COUNT=$(find rules \
            -type f \
            -name "*.mrs" \
            | wc -l)


          SRS_COUNT=$(find rules \
            -type f \
            -name "*.srs" \
            | wc -l)


          TOTAL_COUNT=$((MRS_COUNT + SRS_COUNT))


          echo "MRS files : ${MRS_COUNT}"

          echo "SRS files : ${SRS_COUNT}"

          echo "TOTAL     : ${TOTAL_COUNT}"


          if [ "${TOTAL_COUNT}" -eq 0 ]; then

            echo "ERROR: No rule files."

            exit 1

          fi


          echo "OK: Rule files detected."


      # ======================================================
      # Git Status
      # ======================================================

      - name: Git Status

        run: |

          echo "=========================================="

          echo "GIT STATUS"

          echo "=========================================="

          git status --short


      # ======================================================
      # Commit
      # ======================================================

      - name: Commit Changes

        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add rules/


          if git diff \
            --cached \
            --quiet; then

            echo "No changes."

            exit 0

          fi


          git commit \
            -m "chore: sync rules $(date -u '+%Y-%m-%d %H:%M UTC')"


      # ======================================================
      # Push
      # ======================================================

      - name: Push

        run: |

          git push
