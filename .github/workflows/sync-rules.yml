name: Sync Rules

on:
  schedule:
    # 每天北京时间 08:00 自动运行
    - cron: "0 0 * * *"

  # 允许手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # 1. Checkout 自己的仓库
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ==========================================
      # 2. 下载 milangree/rules
      #
      # 只下载：
      # rules/mihomo
      # ==========================================
      - name: Clone milangree rules
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/milangree-rules

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/milangree/rules.git \
            /tmp/milangree-rules

          cd /tmp/milangree-rules

          git sparse-checkout set rules/mihomo


      # ==========================================
      # 3. 下载 217heidai/adblockfilters
      # ==========================================
      - name: Clone 217heidai adblockfilters
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/adblockfilters

          git clone \
            --depth 1 \
            https://github.com/217heidai/adblockfilters.git \
            /tmp/adblockfilters


      # ==========================================
      # 4. 下载 X-Shelby GeoIP
      # ==========================================
      - name: Download X-Shelby geoip
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/geoip

          mkdir -p /tmp/geoip

          for file in \
            cn.mrs \
            cn_v4.mrs \
            cn_v6.mrs \
            cnip_all.mrs
          do

            echo "Downloading ${file}"

            curl -fL \
              "https://github.com/X-Shelby/geoip/releases/download/latest/${file}" \
              -o "/tmp/geoip/${file}"

          done


      # ==========================================
      # 5. 下载最新 Mihomo
      #
      # 用于把 milangree YAML 转换为 MRS
      # ==========================================
      - name: Download Mihomo
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/mihomo

          mkdir -p /tmp/mihomo

          curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            -o /tmp/mihomo/release.json

          python3 <<'PY'
          import json
          import sys

          with open("/tmp/mihomo/release.json") as f:
              data = json.load(f)

          assets = data.get("assets", [])

          found = None

          # ------------------------------------------
          # 优先 compatible
          # ------------------------------------------
          for asset in assets:

              name = asset["name"]

              if (
                  "linux-amd64-compatible" in name
                  and name.endswith(".gz")
              ):

                  found = asset["browser_download_url"]
                  break


          # ------------------------------------------
          # fallback linux-amd64
          # ------------------------------------------
          if not found:

              for asset in assets:

                  name = asset["name"]

                  if (
                      "linux-amd64" in name
                      and name.endswith(".gz")
                  ):

                      found = asset["browser_download_url"]
                      break


          if not found:

              print("Available assets:")

              for asset in assets:
                  print(asset["name"])

              sys.exit(
                  "ERROR: Cannot find Mihomo Linux amd64 release"
              )


          print("Mihomo URL:")
          print(found)


          with open(
              "/tmp/mihomo/url",
              "w"
          ) as f:

              f.write(found)

          PY

          URL=$(cat /tmp/mihomo/url)

          echo "Downloading Mihomo:"
          echo "$URL"

          curl -fL \
            "$URL" \
            -o /tmp/mihomo/mihomo.gz

          gunzip \
            /tmp/mihomo/mihomo.gz

          chmod +x \
            /tmp/mihomo/mihomo

          echo ""
          echo "Mihomo version:"
          /tmp/mihomo/mihomo -v


      # ==========================================
      # 6. milangree mihomo → Mihomo
      #
      # domain:
      # *_domain.yaml → *.mrs
      #
      # ipcidr:
      # *_ipcidr.yaml → *.mrs
      #
      # classical:
      # *_classical.yaml → 排除
      #
      # README:
      # 排除
      # ==========================================
      - name: Sync milangree to Mihomo
        shell: bash
        run: |
          set -Eeuo pipefail

          SRC="/tmp/milangree-rules/rules/mihomo"
          DST="$GITHUB_WORKSPACE/rules/Mihomo"
          MIHOMO="/tmp/mihomo/mihomo"

          # 删除旧 Mihomo
          rm -rf "$DST"

          mkdir -p "$DST"


          python3 <<'PY'
          import os
          import subprocess

          SRC = "/tmp/milangree-rules/rules/mihomo"
          DST = os.environ["GITHUB_WORKSPACE"] + "/rules/Mihomo"
          MIHOMO = "/tmp/mihomo/mihomo"

          converted = 0
          skipped = 0
          failed = 0


          for root, dirs, files in os.walk(SRC):

              for filename in files:

                  lower = filename.lower()


                  # ==================================
                  # 只处理 YAML
                  # ==================================
                  if not lower.endswith(".yaml"):

                      skipped += 1

                      continue


                  # ==================================
                  # classical
                  # 不转换
                  # ==================================
                  if "_classical.yaml" in lower:

                      print(
                          "SKIP classical:",
                          os.path.join(root, filename)
                      )

                      skipped += 1

                      continue


                  # ==================================
                  # domain
                  # ==================================
                  if "_domain.yaml" in lower:

                      behavior = "domain"


                  # ==================================
                  # ipcidr
                  # ==================================
                  elif "_ipcidr.yaml" in lower:

                      behavior = "ipcidr"


                  # ==================================
                  # 其他 YAML
                  # ==================================
                  else:

                      print(
                          "SKIP unknown:",
                          os.path.join(root, filename)
                      )

                      skipped += 1

                      continue


                  source = os.path.join(
                      root,
                      filename
                  )


                  # ==================================
                  # 保持上游目录结构
                  # ==================================
                  relative_dir = os.path.relpath(
                      root,
                      SRC
                  )


                  if relative_dir == ".":

                      relative_dir = ""


                  target_dir = os.path.join(
                      DST,
                      relative_dir
                  )


                  os.makedirs(
                      target_dir,
                      exist_ok=True
                  )


                  # ==================================
                  # 输出 MRS
                  # ==================================
                  output = os.path.join(
                      target_dir,
                      os.path.splitext(filename)[0] + ".mrs"
                  )


                  print()
                  print("=" * 70)
                  print("Source :", source)
                  print("Type   :", behavior)
                  print("Output :", output)
                  print("=" * 70)


                  result = subprocess.run(
                      [
                          MIHOMO,
                          "convert-ruleset",
                          behavior,
                          "yaml",
                          source,
                          output
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True
                  )


                  print(result.stdout)


                  # ==================================
                  # 转换成功
                  # ==================================
                  if (
                      result.returncode == 0
                      and os.path.isfile(output)
                      and os.path.getsize(output) > 0
                  ):

                      converted += 1

                      print(
                          "SUCCESS:",
                          output
                      )


                  # ==================================
                  # 转换失败
                  # ==================================
                  else:

                      failed += 1

                      print(
                          "FAILED:",
                          source
                      )


                      if os.path.exists(output):

                          os.remove(output)


          print()
          print("=" * 70)
          print("milangree → Mihomo completed")
          print("=" * 70)
          print("Converted :", converted)
          print("Skipped   :", skipped)
          print("Failed    :", failed)
          print("=" * 70)

          PY


      # ==========================================
      # 7. Mihomo 最终只保留 MRS
      # ==========================================
      - name: Cleanup Mihomo
        shell: bash
        run: |
          set -Eeuo pipefail

          find rules/Mihomo \
            -type f \
            ! -name "*.mrs" \
            -delete

          find rules/Mihomo \
            -type d \
            -empty \
            -delete


      # ==========================================
      # 8. 217heidai → AdBlock
      #
     # 只同步 .mrs
      # ==========================================
      - name: Sync 217heidai to AdBlock
        shell: bash
        run: |
          set -Eeuo pipefail

          SRC="/tmp/adblockfilters/rules"
          DST="$GITHUB_WORKSPACE/rules/AdBlock"

          rm -rf "$DST"

          mkdir -p "$DST"


          find "$SRC" \
            -type f \
            -name "*.mrs" \
            -print0 |
          while IFS= read -r -d '' file
          do

              relative="${file#$SRC/}"

              target="$DST/$relative"

              mkdir -p \
                "$(dirname "$target")"

              cp "$file" "$target"

          done


      # ==========================================
      # 9. AdBlock 只保留 MRS
      # ==========================================
      - name: Cleanup AdBlock
        shell: bash
        run: |
          set -Eeuo pipefail

          find rules/AdBlock \
            -type f \
            ! -name "*.mrs" \
            -delete

          find rules/AdBlock \
            -type d \
            -empty \
            -delete


      # ==========================================
      # 10. X-Shelby → geoip
      # ==========================================
      - name: Sync X-Shelby to geoip
        shell: bash
        run: |
          set -Eeuo pipefail

          DST="$GITHUB_WORKSPACE/rules/geoip"

          rm -rf "$DST"

          mkdir -p "$DST"

          cp -a \
            /tmp/geoip/. \
            "$DST/"


      # ==========================================
      # 11. geoip 只保留 MRS
      # ==========================================
      - name: Cleanup geoip
        shell: bash
        run: |
          set -Eeuo pipefail

          find rules/geoip \
            -type f \
            ! -name "*.mrs" \
            -delete

          find rules/geoip \
            -type d \
            -empty \
            -delete


      # ==========================================
      # 12. 最终检查
      #
      # 整个 rules/ 下只能存在 .mrs
      # ==========================================
      - name: Check final rules
        shell: bash
        run: |
          set -Eeuo pipefail

          echo ""
          echo "=========================================="
          echo "Final directory"
          echo "=========================================="

          find rules \
            -type f \
            | sort


          echo ""
          echo "=========================================="
          echo "MRS count"
          echo "=========================================="

          MRS_COUNT=$(find rules \
            -type f \
            -name "*.mrs" \
            | wc -l)

          echo "MRS files: $MRS_COUNT"


          echo ""
          echo "=========================================="
          echo "Checking non-MRS files"
          echo "=========================================="

          NON_MRS=$(find rules \
            -type f \
            ! -name "*.mrs" \
            | wc -l)

          echo "Non-MRS files: $NON_MRS"


          if [ "$NON_MRS" -ne 0 ]; then

              echo ""
              echo "ERROR: Non-MRS files detected!"

              find rules \
                -type f \
                ! -name "*.mrs"

              exit 1

          fi


          if [ "$MRS_COUNT" -eq 0 ]; then

              echo ""
              echo "ERROR: No MRS files generated!"

              exit 1

          fi


          echo ""
          echo "=========================================="
          echo "SUCCESS"
          echo "=========================================="
          echo "All rules are MRS."
          echo "MRS count: $MRS_COUNT"


      # ==========================================
      # 13. 提交更新
      # ==========================================
      - name: Commit changes
        shell: bash
        run: |
          set -Eeuo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules


          if git diff --cached --quiet; then

              echo "No changes detected."

          else

              git commit \
                -m "sync: update rules"

              git push

          fi
