name: Sync Rules

on:
  schedule:
    # 每天北京时间 08:00 自动运行
    - cron: "0 0 * * *"

  # 允许手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 下载自己的仓库
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 下载 milangree/rules
      - name: Clone milangree rules
        run: |
          git clone --depth 1 \
            https://github.com/milangree/rules.git \
            /tmp/milangree-rules

      # 下载 217heidai/adblockfilters
      - name: Clone 217heidai adblockfilters
        run: |
          git clone --depth 1 \
            https://github.com/217heidai/adblockfilters.git \
            /tmp/adblockfilters

      # 下载 X-Shelby/geoip
      - name: Download X-Shelby geoip
        run: |
          mkdir -p /tmp/geoip

          for file in cn.mrs cn_v4.mrs cn_v6.mrs cnip_all.mrs; do
            curl -fL \
              "https://github.com/X-Shelby/geoip/releases/download/latest/${file}" \
              -o "/tmp/geoip/${file}"
          done

      # 同步 milangree → Exit
      - name: Sync milangree rules
        run: |
          rm -rf rules/Exit
          mkdir -p rules/Exit

          cp -a /tmp/milangree-rules/rules/. ./rules/Exit/

      # 同步 217heidai → AdBlock
      - name: Sync 217heidai rules
        run: |
          rm -rf rules/AdBlock
          mkdir -p rules/AdBlock

          cp -a /tmp/adblockfilters/rules/. ./rules/AdBlock/

      # 同步 X-Shelby geoip → geoip
      - name: Sync X-Shelby geoip
        run: |
          rm -rf rules/geoip
          mkdir -p rules/geoip

          cp -a /tmp/geoip/. ./rules/geoip/

      # 提交更新
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rules

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "sync: update rules"
            git push
          fi
