name: Sync Rules

on:

  # ==========================================================
  # 每天北京时间 12:00
  #
  # GitHub Actions 使用 UTC
  #
  # 北京时间 12:00
  # =
  # UTC 04:00
  # ==========================================================

  schedule:

    - cron: "0 4 * * *"


  # 支持手动运行

  workflow_dispatch:


# ============================================================
# GitHub Actions 权限
# ============================================================

permissions:

  contents: write


# ============================================================
# Job
# ============================================================

jobs:

  sync:

    name: Sync Rules

    runs-on: ubuntu-latest


    steps:


      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v5

        with:

          fetch-depth: 1


      # ======================================================
      # 2. Python
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.x"


      # ======================================================
      # 3. 安装依赖
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests


      # ======================================================
      # 4. 同步规则
      # ======================================================

      - name: Sync Rules

        run: |

          python sync_rules.py


      # ======================================================
      # 5. 显示最终文件
      # ======================================================

      - name: Show Rules

        run: |

          echo ""
          echo "=========================================="
          echo "FINAL RULE FILES"
          echo "=========================================="

          find rules -type f | sort


      # ======================================================
      # 6. 检查子目录
      # ======================================================

      - name: Check directories

        run: |

          echo ""
          echo "=========================================="
          echo "DIRECTORY CHECK"
          echo "=========================================="

          if find rules -mindepth 2 -type d | grep -q .; then

            echo "ERROR: Subdirectories detected."

            find rules -mindepth 2 -type d

            exit 1

          else

            echo "OK: No subdirectories."

          fi


      # ======================================================
      # 7. Git 状态
      # ======================================================

      - name: Git Status

        run: |

          echo ""
          echo "=========================================="
          echo "GIT STATUS"
          echo "=========================================="

          git status --short


      # ======================================================
      # 8. Commit
      # ======================================================

      - name: Commit changes

        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add rules/


          if git diff --cached --quiet; then

            echo ""
            echo "No rule changes."

            exit 0

          fi


          git commit \
            -m "chore: sync rules $(date -u '+%Y-%m-%d %H:%M UTC')"


      # ======================================================
      # 9. Push
      # ======================================================

      - name: Push changes

        run: |

          git push
