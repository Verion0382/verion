name: Sync Rules

on:

  # ==========================================================
  # 每天北京时间 12:00
  #
  # GitHub Actions 使用 UTC
  #
  # 北京时间 UTC+8
  # 12:00 = UTC 04:00
  # ==========================================================

  schedule:

    - cron: "0 4 * * *"

  # 允许手动运行

  workflow_dispatch:


permissions:

  contents: write


jobs:

  sync:

    name: Sync Rules

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v5

        with:

          fetch-depth: 1


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.x"


      # ======================================================
      # 安装 requests
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests


      # ======================================================
      # 同步规则
      # ======================================================

      - name: Sync Rules

        run: |

          python sync_rules.py


      # ======================================================
      # 显示最终目录
      # ======================================================

      - name: Show Rules

        run: |

          echo "=========================================="

          echo "FINAL RULE FILES"

          echo "=========================================="


          find rules -maxdepth 2 -type f | sort


      # ======================================================
      # 检查有没有子目录
      # ======================================================

      - name: Check subdirectories

        run: |

          echo "=========================================="

          echo "CHECK SUBDIRECTORIES"

          echo "=========================================="


          if find rules -mindepth 2 -type d | grep -q .; then

            echo "ERROR: Subdirectories detected."

            find rules -mindepth 2 -type d

            exit 1

          fi


          echo "OK: No subdirectories."


      # ======================================================
      # Git 状态
      # ======================================================

      - name: Git Status

        run: |

          git status --short


      # ======================================================
      # Commit
      # ======================================================

      - name: Commit changes

        run: |

          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add rules/


          if git diff --cached --quiet; then

            echo "No changes."

            exit 0

          fi


          git commit \
            -m "chore: sync rules $(date -u '+%Y-%m-%d %H:%M UTC')"


      # ======================================================
      # Push
      # ======================================================

      - name: Push

        run: |

          git push
